<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>70MM LOUNGE | BLOG</title>
    <meta name="title" content="70MM LOUNGE">

     <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="stylesheet" href="./assets/css/style.css">
        <style>
            :root {
                --profile-bg: #080b10;
                --profile-panel: #10151c;
                --profile-line: #252c35;
                --profile-text: #f5f7fa;
                --profile-muted: #a8b0bc;
            }

            .gallery-page {
                min-height: 0;
                overflow: visible;
                color: var(--profile-text);
                background: var(--profile-bg);
                font-family: "DM Sans", sans-serif;
            }

            .gallery-shell {
                width: min(935px, 100%);
                margin-inline: auto;
            }

            .gallery-topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 18px 16px;
                color: var(--profile-text);
                background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
            }

            .gallery-top-action {
                display: grid;
                width: 38px;
                height: 38px;
                color: var(--profile-text);
                place-items: center;
            }

            .gallery-back-button {
                display: grid;
                width: 34px;
                height: 34px;
                padding: 0;
                color: var(--profile-text);
                background: transparent;
                border: 0;
                place-items: center;
                cursor: pointer;
            }

            .gallery-back-button ion-icon {
                font-size: 27px;
            }

            .gallery-topbar-title {
                margin: 0;
                color: var(--profile-text);
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: 0;
            }

            .gallery-handle {
                margin: 0;
                font-size: 1.18rem;
                font-weight: 700;
                letter-spacing: 0;
            }

            .gallery-profile {
                display: grid;
                grid-template-columns: 150px 1fr;
                gap: 34px;
                align-items: start;
                padding: 38px 24px 30px;
            }

            .gallery-avatar {
                width: 132px;
                aspect-ratio: 1;
                padding: 5px;
                border: 1px solid #6f5631;
                border-radius: 50%;
                background: #0b0d11;
                box-shadow: 0 0 0 4px #1b1d20, 0 0 22px rgba(208, 164, 79, 0.2);
                transform: translateY(6px);
            }

            .gallery-avatar img {
                display: block;
                width: 100%;
                height: 100%;
                border-radius: inherit;
                object-fit: cover;
            }

            .gallery-profile-main { min-width: 0; }

            .gallery-name-row {
                display: flex;
                align-items: center;
                gap: 20px;
                margin-bottom: 24px;
            }

            .gallery-name {
                margin: 0;
                font-size: clamp(1.4rem, 2.6vw, 1.85rem);
                font-weight: 500;
                transform: translateY(10px);
            }

            .gallery-verified {
                color: #55a9f5;
                font-size: 17px;
                transform: translateY(10px);
            }

            .gallery-stats {
                display: flex;
                gap: 0;
                width: 100%;
                margin: 0;
            }

            .gallery-stat {
                display: grid;
                flex: 1 1 0;
                gap: 0;
                min-width: 0;
            }

            .gallery-stat strong {
                font-size: 1.25rem;
                transform: translateY(-6px);
            }

            .gallery-stat span {
                display: block;
                margin: 0;
                color: var(--profile-muted);
                font-size: 0.9rem;
                transform: translateY(-5px);
            }

            .gallery-bio {
                padding: 0 24px 18px;
                margin-top: -8px;
                color: var(--profile-text);
                line-height: 1.48;
            }

            .gallery-bio p { margin: 0; }
            .gallery-bio .muted { color: var(--profile-muted); }
            .gallery-bio .tag { color: #8aaeff; }

            .gallery-actions {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
                padding: 0 24px 24px;
            }

            .gallery-action {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                padding: 0 10px;
                color: var(--smoky-black-1);
                font: inherit;
                font-weight: 700;
                border: 1px solid var(--profile-line);
                border-radius: 9px;
                background: var(--gold-crayola);
                text-align: center;
                white-space: nowrap;
            }

            .gallery-action.icon-only {
                display: flex;
                padding: 0;
                place-items: center;
            }
            .gallery-action ion-icon { font-size: 22px; }

            .gallery-player-comment-count {
                color: inherit;
                font-size: 0.82rem;
                font-weight: 700;
                line-height: 1;
            }

            .gallery-tabs {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                height: 56px;
                border-top: 1px solid var(--profile-line);
                border-bottom: 1px solid var(--profile-line);
            }

            .gallery-tab {
                display: grid;
                color: var(--gold-crayola);
                place-items: center;
                font-size: 23px;
            }

            .gallery-tab.active {
                color: var(--gold-crayola);
                border-bottom: 2px solid var(--profile-text);
            }

            .gallery-view[hidden] { display: none; }

            .gallery-video-tile video {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000;
            }

            .gallery-tile.gallery-video-tile ion-icon { color: var(--gold-crayola); }

            .gallery-video-tile { cursor: pointer; }

            .gallery-player[hidden] { display: none; }

            .gallery-player {
                position: fixed;
                z-index: 20;
                inset: 0;
                display: grid;
                padding: 18px;
                background: rgba(0, 0, 0, 0.88);
                place-items: center;
            }

            .gallery-player-stage {
                position: relative;
                display: flex;
                overflow: visible;
                width: min(100%, 430px);
                height: min(92vh, 765px);
                aspect-ratio: 9 / 16;
                background: #000;
                border-radius: 12px;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
                align-items: center;
                justify-content: center;
                transform-origin: top center;
                transition: transform 460ms cubic-bezier(0.22, 1, 0.36, 1), border-radius 460ms ease;
            }

            .gallery-player.comments-open .gallery-player-stage {
                transform: translateY(-7vh) scale(0.82);
                border-radius: 16px;
            }

            .gallery-player.comments-open .gallery-player-topbar,
            .gallery-player.comments-open .gallery-player-actions,
            .gallery-player.comments-open .gallery-player-brand,
            .gallery-player.comments-open .gallery-player-stage .gallery-player-center-controls {
                opacity: 0;
                pointer-events: none;
            }

            .gallery-player-comments-mute {
                position: absolute;
                z-index: 3;
                bottom: 18px;
                left: 18px;
                display: grid;
                width: 42px;
                height: 42px;
                color: #fff;
                background: rgba(18, 18, 18, 0.8);
                border: 0;
                border-radius: 50%;
                opacity: 0;
                pointer-events: none;
                place-items: center;
                transition: opacity 220ms ease;
            }

            .gallery-player.comments-open .gallery-player-comments-mute {
                opacity: 1;
                pointer-events: auto;
            }

            .gallery-comments-backdrop,
            .gallery-comments-sheet { display: none; }

            .gallery-player.comments-open .gallery-comments-backdrop {
                position: absolute;
                z-index: 4;
                display: block;
                inset: 0;
                background: rgba(0, 0, 0, 0.2);
            }

            .gallery-player.comments-open .gallery-comments-sheet {
                position: absolute;
                z-index: 5;
                right: 0;
                bottom: 0;
                left: 0;
                display: flex;
                flex-direction: column;
                height: min(63vh, 620px);
                color: #f5f5f5;
                background: #121212;
                border-radius: 18px 18px 0 0;
                transform: translateY(0);
                animation: gallery-comments-slide-up 460ms cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .gallery-comments-header {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 10px 18px 18px;
            }

            .gallery-comments-handle {
                width: 42px;
                height: 4px;
                margin-bottom: 22px;
                background: #aeb1b5;
                border-radius: 99px;
            }

            .gallery-comments-options {
                position: absolute;
                top: 18px;
                right: 18px;
                display: grid;
                width: 34px;
                height: 34px;
                color: #fff;
                background: transparent;
                border: 0;
                place-items: center;
            }

            .gallery-comments-options ion-icon { font-size: 22px; }

            .gallery-comments-heading {
                margin: 0;
                font-family: "Forum", serif;
                font-size: 1.5rem;
                text-align: center;
            }

            .gallery-comments-subtext {
                margin: 8px 0 0;
                color: #aeb1b5;
                font-size: 0.9rem;
            }

            .gallery-comments-list {
                flex: 1;
                overflow-y: auto;
                padding: 0 18px;
            }

            .gallery-comments-footer {
                border-top: 1px solid #282828;
                background: #121212;
            }

            .gallery-comments-quick-reactions {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                padding: 12px 18px 10px;
                overflow-x: auto;
            }

            .gallery-comments-emoji {
                flex: 0 0 auto;
                padding: 0;
                font-size: 1.65rem;
                line-height: 1;
                background: transparent;
                border: 0;
            }

            .gallery-comments-composer {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 14px 14px;
            }

            .gallery-comments-avatar {
                flex: 0 0 auto;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                object-fit: cover;
            }

            .gallery-comments-input-wrap {
                display: flex;
                flex: 1;
                align-items: center;
                min-width: 0;
                height: 44px;
                padding: 0 8px 0 14px;
                border: 1px solid #3a3a3a;
                border-radius: 24px;
            }

            .gallery-comments-input {
                flex: 1;
                min-width: 0;
                color: #fff;
                font: inherit;
                background: transparent;
                border: 0;
                outline: 0;
            }

            .gallery-comments-input::placeholder { color: #aeb1b5; }

            .gallery-comments-media {
                display: flex;
                gap: 2px;
            }

            .gallery-comments-send {
                display: none;
                width: 32px;
                height: 32px;
                color: var(--gold-crayola);
                background: transparent;
                border: 0;
                place-items: center;
            }

            .gallery-comments-input:not(:placeholder-shown) ~ .gallery-comments-media .gallery-comments-send {
                display: grid;
            }

            .gallery-comments-send ion-icon { font-size: 22px; }

            .gallery-gif-backdrop {
                position: absolute;
                inset: 0;
                z-index: 8;
                display: none;
                background: rgba(0, 0, 0, 0.42);
            }

            .gallery-gif-panel {
                position: absolute;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 9;
                display: none;
                height: min(70vh, 620px);
                padding: 14px 12px 12px;
                background: #111214;
                border-radius: 18px 18px 0 0;
                box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.35);
                overflow: hidden;
            }

            .gallery-gif-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 12px;
            }

            .gallery-gif-title {
                margin: 0;
                font-size: 1.2rem;
                font-weight: 700;
                color: #fff;
            }

            .gallery-gif-close {
                display: grid;
                place-items: center;
                width: 36px;
                height: 36px;
                background: transparent;
                border: 0;
                color: #fff;
                border-radius: 50%;
            }

            .gallery-gif-search {
                width: 100%;
                height: 46px;
                margin-bottom: 12px;
                padding: 0 16px;
                color: #fff;
                background: rgba(255, 255, 255, 0.08);
                border: 0;
                border-radius: 999px;
                outline: 0;
            }

            .gallery-gif-search::placeholder {
                color: rgba(255, 255, 255, 0.7);
            }

            .gallery-gif-results {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                height: calc(100% - 98px);
                overflow-y: auto;
            }

            .gallery-gif-item {
                display: block;
                width: 100%;
                padding: 0;
                background: #1c1d20;
                border: 0;
                border-radius: 14px;
                overflow: hidden;
            }

            .gallery-gif-item img {
                display: block;
                width: 100%;
                height: 150px;
                object-fit: cover;
            }

            .gallery-gif-empty {
                grid-column: 1 / -1;
                padding: 18px 12px;
                color: rgba(255, 255, 255, 0.75);
                text-align: center;
                font-size: 0.95rem;
            }

            .gallery-comments-item {
                display: flex;
                gap: 10px;
                padding: 12px 0;
                color: #f5f5f5;
                border-radius: 10px;
                max-height: 220px;
                overflow: hidden;
                opacity: 1;
                transform: translateX(0) scale(1);
                transition: max-height 250ms ease, opacity 250ms ease, transform 250ms ease, padding 250ms ease, margin 250ms ease;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .gallery-comments-item.deleting {
                opacity: 0;
                transform: translateX(18px) scale(0.98);
                max-height: 0;
                padding-top: 0;
                padding-bottom: 0;
                margin: 0;
                pointer-events: none;
            }

            .gallery-comments-item:active {
                background: rgba(255, 255, 255, 0.03);
            }

            .gallery-comments-item-avatar {
                flex: 0 0 auto;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                object-fit: cover;
            }

            .gallery-comments-item-body {
                min-width: 0;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }
            .gallery-comments-item-header {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .gallery-comments-item-author {
                font-size: 1.02rem;
                font-weight: 700;
            }
            .gallery-comments-item-time {
                color: #aeb1b5;
                font-size: 0.76rem;
                font-weight: 500;
            }
            .gallery-comments-item-text {
                margin: 3px 0 0;
                font-size: 0.98rem;
                line-height: 1.45;
                overflow-wrap: anywhere;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }
            .gallery-comments-item-reply {
                margin-top: 8px;
                padding: 0;
                color: #aeb1b5;
                font-size: 0.86rem;
                font-weight: 700;
                letter-spacing: 0.02em;
                background: transparent;
                border: 0;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }
            .gallery-comments-item-gif {
                display: block;
                width: 100%;
                max-width: 220px;
                margin-top: 8px;
                border-radius: 12px;
            }

            .gallery-context-backdrop {
                position: absolute;
                inset: 0;
                z-index: 6;
                display: none;
                background: rgba(0, 0, 0, 0.32);
            }

            .gallery-context-backdrop.visible {
                display: block;
            }

            .gallery-context-sheet {
                position: absolute;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 7;
                display: none;
                padding: 12px 12px 18px;
                background: rgba(21, 21, 21, 0.98);
                border-radius: 18px 18px 0 0;
                box-shadow: 0 -16px 32px rgba(0, 0, 0, 0.35);
                transform: translateY(100%);
                transition: transform 240ms ease;
            }

            .gallery-context-sheet.open {
                display: block;
                transform: translateY(0);
            }

            .gallery-context-grip {
                width: 42px;
                height: 4px;
                margin: 2px auto 10px;
                background: rgba(255, 255, 255, 0.32);
                border-radius: 999px;
            }

            .gallery-context-action {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                padding: 14px 12px;
                color: #fff;
                font-family: inherit;
                font-size: 1rem;
                font-weight: 600;
                background: transparent;
                border: 0;
                border-radius: 12px;
                text-align: left;
            }

            .gallery-context-action + .gallery-context-action {
                margin-top: 4px;
            }

            .gallery-context-action.reply {
                color: #ffffff;
            }

            .gallery-context-action.delete {
                color: #ed4956;
            }

            .gallery-context-action ion-icon {
                font-size: 20px;
            }

            .gallery-comments-media button {
                display: grid;
                width: 32px;
                height: 32px;
                color: #fff;
                background: transparent;
                border: 0;
                place-items: center;
            }

            .gallery-comments-media ion-icon { font-size: 21px; }

            @keyframes gallery-comments-slide-up {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }

            .gallery-player.comments-closing .gallery-comments-sheet {
                animation: gallery-comments-slide-down 360ms cubic-bezier(0.4, 0, 1, 1) both;
            }

            @keyframes gallery-comments-slide-down {
                from { transform: translateY(0); }
                to { transform: translateY(100%); }
            }

            .gallery-player-video {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                overflow: hidden;
                border-radius: inherit;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }

            .gallery-player-topbar {
                position: absolute;
                z-index: 1;
                top: 0;
                right: 0;
                left: 0;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 18px 16px;
                color: var(--profile-text);
                background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
            }

            .gallery-player-back,
            .gallery-player-control,
            .gallery-player-action {
                display: grid;
                padding: 0;
                color: var(--profile-text);
                background: transparent;
                border: 0;
                place-items: center;
            }

            .gallery-player-back { width: 34px; height: 34px; }
            .gallery-player-back ion-icon { font-size: 27px; }

            .gallery-player-title {
                margin: 0;
                font-size: 1.35rem;
                font-weight: 700;
            }

            .gallery-player-actions {
                position: absolute;
                z-index: 1;
                right: 10px;
                bottom: 74px;
                display: grid;
                overflow: visible;
                padding: 12px;
                gap: 18px;
            }

            .gallery-player-action { gap: 3px; min-width: 44px; overflow: visible; font-size: 0.7rem; }
            .gallery-player-action ion-icon { font-size: 28px; }
            .gallery-player-action#gallery-player-comment { transform: translateY(-8px); }

            .gallery-player-action.is-liked ion-icon { color: #e54d69; }

            .gallery-player-like {
                position: relative;
                color: #fff;
                cursor: pointer;
                overflow: visible;
                touch-action: manipulation;
            }

            .gallery-like-burst {
                position: absolute;
                z-index: 2;
                top: 50%;
                left: 50%;
                width: 1px;
                height: 1px;
                pointer-events: none;
                overflow: visible;
            }

            .gallery-like-burst svg { overflow: visible; }

            .gallery-player-like svg {
                width: 34px;
                height: 34px;
                fill: transparent;
                stroke: currentColor;
                stroke-width: 2;
                overflow: visible;
                transform-origin: center;
                transition: fill 180ms ease, color 180ms ease, transform 180ms ease;
            }

            .gallery-player-like.is-liked { color: var(--gold-crayola); }

            .gallery-player-like.is-liked svg {
                fill: currentColor;
                stroke: currentColor;
                animation: gallery-heart-pop 450ms cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
            }

            .gallery-player-like-count {
                min-width: 34px;
                color: inherit;
                font-size: 0.82rem;
                font-weight: 700;
                text-align: center;
            }

            @keyframes gallery-heart-pop {
                0% { transform: scale(1); }
                25% { transform: scale(0.75); }
                50% { transform: scale(1.35); }
                75% { transform: scale(0.95); }
                100% { transform: scale(1); }
            }

            .gallery-player-center-controls {
                position: absolute;
                z-index: 1;
                top: 50%;
                left: 50%;
                display: grid;
                gap: 4px;
                transform: translate(-50%, -50%);
                justify-items: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 180ms ease;
            }

            .gallery-player-stage.controls-visible .gallery-player-center-controls {
                opacity: 1;
                pointer-events: auto;
            }

            .gallery-player-control { width: 62px; height: 62px; }
            .gallery-player-control ion-icon { font-size: 52px; }
            .gallery-player-volume ion-icon { font-size: 25px; }

            .gallery-player-brand {
                position: absolute;
                z-index: 1;
                bottom: 42px;
                left: 16px;
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--profile-text);
                text-decoration: none;
            }

            .gallery-player-brand img {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                object-fit: cover;
            }

            .gallery-player-brand span { font-size: 1.05rem; font-weight: 700; }

            .gallery-player-seek {
                position: absolute;
                z-index: 1;
                right: 16px;
                bottom: 20px;
                left: 16px;
                width: calc(100% - 32px);
                height: 3px;
                accent-color: var(--gold-crayola);
                cursor: pointer;
            }

            .gallery-player-seek::-webkit-slider-thumb {
                width: 0;
                height: 0;
                appearance: none;
            }

            .gallery-player-seek::-moz-range-thumb {
                width: 0;
                height: 0;
                border: 0;
            }

            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
                padding-top: 3px;
            }

            .gallery-tile {
                position: relative;
                display: block;
                overflow: hidden;
                aspect-ratio: 1;

            window.addEventListener("popstate", () => {
                if (!galleryPlayer.hidden) closeGalleryPlayer(true);
            });

            if (galleryBackButton) {
                galleryBackButton.addEventListener("click", () => {
                    if (document.referrer && document.referrer !== "") {
                        window.history.back();
                        return;
                    }

                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = "./index.html";
                    }
                });
            }

            galleryTabs.forEach((tab) => {
                tab.addEventListener("click", () => {
                    const targetId = tab.dataset.galleryTab;

                    galleryTabs.forEach((item) => {
                        const isActive = item === tab;
                        item.classList.toggle("active", isActive);
                        item.setAttribute("aria-selected", String(isActive));
                    });

                    galleryViews.forEach((view) => {
                        view.hidden = view.id !== targetId;
                    });
                });
            });
        </script>

    
</body>
</html>
